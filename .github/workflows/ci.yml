name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (engine, config, wizard, CLI, both profiles x config matrix)
        run: python -m unittest discover -s tests -v
      - name: Smoke render, lite profile (default answers)
        run: python kit.py init --defaults --profile lite --config "$RUNNER_TEMP/kit.config.json" --out "$RUNNER_TEMP/kit-out-lite"
      - name: Smoke render, full profile (same answers)
        run: python kit.py render --config "$RUNNER_TEMP/kit.config.json" --profile full --out "$RUNNER_TEMP/kit-out-full"
      - name: Smoke render, fictional example (full profile)
        run: python kit.py render --config examples/acme-medsoft/kit.config.json --out "$RUNNER_TEMP/kit-out-example"
      - name: Smoke render, fictional example (lite profile)
        run: python kit.py render --config examples/acme-medsoft-lite/kit.config.json --out "$RUNNER_TEMP/kit-out-example-lite"
