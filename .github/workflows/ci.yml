name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (engine, config, wizard, CLI, all templates x config matrix)
        run: python -m unittest discover -s tests -v
      - name: Smoke render with default answers
        run: python kit.py init --defaults --config "$RUNNER_TEMP/kit.config.json" --out "$RUNNER_TEMP/kit-out"
